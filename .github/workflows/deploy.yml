name: CI/CD Pipeline - Client Gallery

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required for actions/checkout

jobs:
  # ==========================================
  # STAGE 1: CI QUALITY GATES
  # ==========================================
  quality-gates:
    name: Code Quality & Security Audits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gallery-frontend/package-lock.json

      - name: Clean Dependency Installation
        run: npm ci

      - name: Gate 1 - Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Gate 2 - Strict TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Gate 3 - ESLint Static Analysis
        run: npm run lint

  # ==========================================
  # STAGE 2: BUILD & CONTINUOUS DEPLOYMENT
  # ==========================================
  deploy:
    name: Build & Deploy to AWS (S3 / CloudFront)
    needs: quality-gates
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gallery-frontend/package-lock.json

      - name: Clean Dependency Installation
        run: npm ci

      - name: Build Static Production Assets
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::094813111563:role/GitHubActionsGalleryRole
          aws-region: eu-west-2
          audience: sts.amazonaws.com

      - name: Sync Build Output to Amazon S3
        run: |
          aws s3 sync dist/ s3://samuelojo-client-gallery-2026/ --delete

      - name: Invalidate Amazon CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID || 'E1B2IZH9JKGO9B' }} \
            --paths "/*"