name: Deploy Client Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the temporary OIDC JWT token
  contents: read    # Required to check out your repository code

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: gallery-frontend/package-lock.json

      - name: Install & Build
        run: |
          cd gallery-frontend
          npm ci
          npm run build
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
          VITE_ZIPPER_URL: ${{ vars.VITE_ZIPPER_URL }}
      - name: Debug OIDC Token Claims
        run: |
          # Request the OIDC JWT token directly from the GitHub runner environment
          TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          
          # Decode the payload of the JWT and print the exact claims
          echo "=== Decoded OIDC Token Claims ==="
          echo "$TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{sub: .sub, aud: .aud, repository: .repository, repository_owner: .repository_owner, job_workflow_ref: .job_workflow_ref}'

    

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::094813111563:role/GitHubActionsGalleryRole
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync gallery-frontend/dist/ s3://samuelojo-client-gallery-2026 --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E1B2IZH9JKGO9B --paths "/*"